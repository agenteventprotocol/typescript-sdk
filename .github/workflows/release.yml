# Release — tag-triggered publish of @agenteventprotocol/sdk to npm with provenance.
# Dormant until a `v*` tag exists; tagging is a maintainer action
# (RELEASING.md). The guards make a stray tag safe: the tag must equal
# package.json's version exactly, and a package still carrying
# `"private": true` (the pre-release shape) refuses to publish.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dev dependencies (ws, for the relay fixture)
        run: npm ci

      - name: Strict typecheck (no emit)
        run: npx --yes -p typescript@6.0.3 tsc -p . --noEmit

      - name: Build dist (the published artifact shape)
        run: npm run build

      - name: End-to-end smoke (emit / consume / control)
        run: bash test/run-smoke.sh

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Refuse to publish the private (pre-release) shape
        run: |
          if [ "$(node -p 'Boolean(require("./package.json").private)')" != "false" ]; then
            echo 'package.json still carries "private": true — this tag is not a release shape' >&2
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
