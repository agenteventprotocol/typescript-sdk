# @aep/sdk CI — strict typecheck + dist build + end-to-end smoke (against the
# vendored relay fixture), plus a regen-diff job that regenerates src/gen/
# from the spec repo pinned in SPEC_VERSION and fails on any drift.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          # Toolchain: Node 22, TypeScript 6.0.3

      - name: Install dev dependencies (ws, for the relay fixture)
        run: npm ci

      - name: Strict typecheck (no emit)
        run: npx --yes -p typescript@6.0.3 tsc -p . --noEmit

      - name: Build dist (the published artifact shape)
        run: npm run build

      - name: End-to-end smoke (emit / consume / control)
        run: bash test/run-smoke.sh

  regen-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Clone the spec repo at the pinned ref (SPEC_VERSION)
        run: |
          git clone https://github.com/agenteventprotocol/agent-event-protocol.git spec-repo
          git -C spec-repo checkout "$(cat SPEC_VERSION)"

      - name: Regenerate types from the pinned schema registry
        run: |
          python3 spec-repo/schemas/codegen/generate.py
          cp spec-repo/schemas/gen/ts/aep-types.ts src/gen/aep-types.ts

      - name: Committed src/gen/ must match the pinned spec exactly
        run: |
          rm -rf spec-repo
          git diff --exit-code -- src/gen/
